[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "refiner-demo"
version = "0.1.0"
description = "Privacy-first resume refinement workflow reference application"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
  "fastapi==0.141.1",
  "python-multipart==0.0.32",
  "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
  "cyclonedx-bom==7.3.1",
  "httpx2==2.12.0",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pip-licenses==5.5.5",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.3",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/refiner"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings --cov=backend/refiner --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["backend/refiner", "scripts", "tests"]
exclude = ["frontend"]
warn_unreachable = true
