name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # This public repository uses an internal ARC runner. Never execute code
    # supplied by a fork; only the repository owner may start this job.
    if: github.repository == 'gitvssh/refiner' && github.actor == 'gitvssh'
    runs-on: homelab-refiner
    timeout-minutes: 30
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install uv without Actions cache
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          version: "0.9.26"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Pin Python
        run: uv python install 3.14

      - name: Run the complete public-release quality gate
        run: python3 scripts/quality.py all
